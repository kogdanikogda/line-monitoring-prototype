<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Линия Цесис 2 — смена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAEB;--side:#F4F6F6;--card:#FFFFFF;--inner:#F3F5F6;--line:#E2E6E8;--tx:#14181D;--mu:#5A636E;--soft:#ECEFF1;--ink:#121519;--ink-tx:#FFFFFF;
  --ok:#2F8F63;--idle:#6E7A89;--pause:#D99A16;--wait:#B5835A;--setup:#7A62D6;--heat:#E57A2E;--fault:#D2433A;--estop:#8A1F1F;--nodata:#C5CBD1;
  --blue:#8CCDEB;--blue-d:#2E9BD0;--warn-bg:#FFF2CC;--warn-tx:#634700;
  --tpl1:#3F6FD1;--tpl2:#22899B;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16.5px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* demo strip (not part of the product UI) */
.demo-bar{background:#121519;color:#fff;padding:8px 20px;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:14.5px;position:sticky;top:0;z-index:30}
.demo-bar .tag{background:var(--pause);color:#121519;font-weight:700;border-radius:99px;padding:3px 12px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl>span{opacity:.65}
.ctl div{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px}
.ctl button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:99px;cursor:pointer;font-size:14.5px}
.ctl button.on{background:#fff;color:#121519;font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:260px 1fr;gap:0;max-width:1520px;margin:0 auto;padding:14px;min-height:calc(100vh - 46px)}
.side{background:var(--side);border-radius:24px 0 0 24px;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:0 10px 18px}
.logo b{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--ink-tx);display:grid;place-items:center;font-size:16px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:99px;color:var(--mu);font-weight:500;font-size:16px;cursor:default;opacity:.85}
.nav.on{background:var(--ink);color:var(--ink-tx);opacity:1;font-weight:600}
.nav.subnav{padding:7px 14px 7px 48px;font-size:15px;border-radius:12px}
.nav.subnav.on{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
.navsep{height:1px;background:var(--line);margin:12px 10px}
.side .note{margin-top:auto;font-size:13.5px;color:var(--mu);padding:12px 10px 0}
.main{background:var(--bg);border-radius:0 24px 24px 0;padding:0 0 0 18px;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;padding:11px 18px;color:var(--mu);font-size:15.5px;box-shadow:var(--shadow)}
.top .sp{flex:1}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);position:relative;color:var(--tx)}
.ibtn .ndot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--fault);border:2px solid var(--card)}
.ava{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--ink-tx);display:grid;place-items:center;font-weight:700;font-size:15px}

.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:16px}
.ph .crumbs{color:var(--mu);font-size:14.5px;margin-bottom:2px}
.ph h1{font-size:32px;margin:0;font-weight:800;letter-spacing:-.01em}
.ph .meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:99px;padding:8px 16px;font-size:15px;color:var(--mu);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px}
.pill b{color:var(--tx);font-weight:600}

/* cards */
.card{background:var(--card);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ch h2{font-size:20px;margin:0;font-weight:700}
.ch .sub{color:var(--mu);font-size:14.5px;width:100%;margin-top:-8px}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:14.5px;color:var(--mu)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.mb{margin-bottom:16px}

/* verdict */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.vic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pause) 18%,var(--card));color:var(--pause)}
.vic svg{width:30px;height:30px}
.verdict .now{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--mu);margin-bottom:4px}
.verdict .head{font-size:24px;line-height:1.25;font-weight:700;margin-bottom:6px}
.verdict .why{color:var(--mu);font-size:17px}
.verdict .why b{color:var(--tx);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}

/* kpi */
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{padding:18px 20px 14px}
.kpi .row{display:flex;gap:14px;align-items:center}
.ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
.ic svg{width:26px;height:26px}
.kpi .val{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.kpi .val small{font-size:17px;font-weight:500;color:var(--mu)}
.kpi .lbl{font-size:15px;color:var(--mu)}
.kpi .foot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:14.5px;color:var(--mu);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.delta{font-weight:700;display:inline-flex;align-items:center;gap:4px}
.bad{color:var(--fault)}.okc{color:var(--ok)}.wrn{color:var(--pause)}
.track{position:relative;height:10px;border-radius:5px;background:var(--soft);margin:14px 0 0}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.track em{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--tx)}

/* timeline */
.tlwrap{position:relative;padding-top:4px}
.tl{position:relative;height:56px;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px)}
.tl .seg{position:absolute;top:0;bottom:0}
.tl .seg+.seg{box-shadow:inset 2px 0 0 var(--card)}
.tl .seg:hover{filter:brightness(1.12);outline:3px solid var(--tx);outline-offset:-3px;z-index:2}
.tpl{position:relative;height:30px;margin-top:6px;border-radius:10px;overflow:hidden;background:var(--soft)}
.tpl .seg{position:absolute;top:0;bottom:0;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;padding-left:12px;white-space:nowrap;overflow:hidden}
.axis{position:relative;height:24px;margin-top:6px;font-size:14px;color:var(--mu)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.nowline{position:absolute;top:-2px;bottom:24px;width:3px;border-radius:2px;background:var(--tx);z-index:3}
.readout{min-height:44px;font-size:16px;margin-top:12px;color:var(--mu);background:var(--inner);border-radius:12px;padding:10px 14px}
.readout b{color:var(--tx)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:14.5px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

svg text{fill:var(--mu);font-size:13px;font-family:inherit}
.two{grid-template-columns:1.35fr 1fr}

/* donut + losses */
.donut{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-bottom:6px}
.donut .c{position:relative;width:150px;height:150px}
.donut .c div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:13.5px;color:var(--mu);line-height:1.2}
.donut .c div b{display:block;font-size:30px;color:var(--tx);font-weight:800}
.donut ul{list-style:none;margin:0;padding:0;font-size:15px}
.donut li{display:flex;align-items:center;gap:8px;padding:4px 0}
.donut li span{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.loss{display:grid;grid-template-columns:minmax(120px,170px) 1fr 104px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.loss .nm{font-size:16px;font-weight:600;line-height:1.25}
.loss .nm small{display:block;color:var(--mu);font-size:13.5px;font-weight:400;margin-top:2px}
.loss .bar{position:relative;height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.loss .bar b{display:block;height:100%;border-radius:6px}
.loss .bar em{position:absolute;top:0;bottom:0;width:3px;background:var(--tx)}
.loss .num{text-align:right;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.loss .num small{display:block;color:var(--mu);font-size:13.5px;font-weight:400}
.grp{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:16px 0 4px;font-weight:700}
.unk{display:inline-block;color:var(--warn-tx);background:var(--warn-bg);border-radius:99px;padding:2px 10px;font-size:13.5px;font-weight:600}

/* events table */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:15px;cursor:pointer;color:var(--mu)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--ink-tx);font-weight:600}
.tabs button span{opacity:.6;margin-left:4px}
.tbl{background:var(--inner);border-radius:16px;padding:6px}
.tr{display:grid;grid-template-columns:140px 230px 1fr 96px 110px;gap:12px;align-items:center;padding:12px 14px;font-size:16px}
.tr.th{font-size:14px;color:var(--mu);padding:8px 14px}
.tr.row{background:var(--card);border-radius:12px;margin-top:6px}
.tr .tm{font-variant-numeric:tabular-nums;color:var(--mu)}
.tr .d,.tr .c{text-align:right;font-variant-numeric:tabular-nums}
.tr .d{font-weight:700}
.tr .c{color:var(--mu)}
.tr .cause{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mu)}
.badge{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:14.5px;font-weight:600;background:color-mix(in srgb,var(--c) 15%,var(--card));color:color-mix(in srgb,var(--c) 80%,var(--tx))}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 2px}
.btn{border:0;background:var(--ink);color:var(--ink-tx);border-radius:99px;padding:7px 16px;cursor:pointer;font-size:14.5px;font-weight:600}
.btn.lt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 18px;cursor:pointer;font-size:15.5px;font-weight:600}
.chip:hover{border-color:var(--tx)}
.empty{padding:22px;text-align:center;color:var(--mu)}
.alert{display:flex;gap:16px;align-items:center;background:var(--warn-bg);color:var(--warn-tx)}
.alert h2{font-size:19px;margin:0 0 2px}
.alert .s{font-size:15px}
.alert .btn{margin-left:auto;white-space:nowrap}

/* templates */
.tp{grid-template-columns:1fr 1fr}
.tcard{display:flex;gap:16px;align-items:center}
.tbadge{width:60px;height:60px;border-radius:18px;color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;flex:none}
.tcard .n{font-size:30px;font-weight:800;line-height:1.1}
.tcard .n small{font-size:16px;font-weight:500;color:var(--mu)}
.tcard .l{font-size:15px;color:var(--mu)}

/* operator */
.op{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.op .top{padding-bottom:16px}
.op .top h1{font-size:28px;margin:0;font-weight:800}
.status{border-radius:24px;padding:28px 32px;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:24px}
.status .lbl{font-size:18px;opacity:.9}
.status .big{font-size:68px;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.status .for{font-size:23px;margin-top:6px;opacity:.95}
.status .ring{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.status .ring svg{width:50px;height:50px;stroke-width:2.2}
.ask{background:var(--warn-bg)}
.ask h2{font-size:28px;margin:0 0 16px;color:var(--warn-tx)}
.reasons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rbtn{min-height:84px;border:0;background:var(--card);color:var(--tx);border-radius:18px;font-size:20px;font-weight:700;cursor:pointer;padding:12px;box-shadow:var(--shadow)}
.rbtn:hover{outline:3px solid var(--ink)}
.done-r{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:23px;font-weight:700}
.prog{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.prog .num{font-size:76px;font-weight:800;line-height:1;letter-spacing:-.02em}
.prog .of{font-size:28px;color:var(--mu)}
.prog-t{position:relative;height:24px;border-radius:12px;background:var(--soft);margin:16px 0 12px}
.prog-t i{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:var(--ok)}
.prog-t em{position:absolute;top:-6px;bottom:-6px;width:4px;border-radius:2px;background:var(--tx)}
.prog-line{font-size:21px}

.foot{color:var(--mu);font-size:14px;margin-top:18px}
.src{display:inline-flex;align-items:center;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;background:var(--soft);color:var(--mu);white-space:nowrap}
.src.opr{background:color-mix(in srgb,var(--blue-d) 14%,var(--card));color:#1F6E96}
.tbd{display:inline-flex;align-items:center;border:1px dashed var(--mu);border-radius:6px;padding:0 7px;font-size:13px;font-weight:600;color:var(--mu);white-space:nowrap}
.chg{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.chg .tot{padding-right:24px;border-right:1px solid var(--line)}
.chg .tot .v{font-size:44px;font-weight:800;line-height:1.05}
.chg .tot .v small{font-size:18px;font-weight:500;color:var(--mu)}
.chg .tot .l{font-size:15px;color:var(--mu);margin-top:4px}
.chg .row{display:grid;grid-template-columns:120px 1fr 280px 110px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:16.5px}
.chg .row:first-child{border-top:0}
.chg .tpls{display:flex;align-items:center;gap:8px;font-weight:600}
.chg .tpls i{font-style:normal;border-radius:8px;color:#fff;padding:2px 10px;font-size:14.5px}
.nbar{position:relative;height:14px;background:var(--soft);border-radius:7px}
.nbar b{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--setup)}
.nbar b.over{background:var(--fault);border-radius:0 7px 7px 0}
.nbar em{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--tx)}

/* round 3: tap instead of hover, operator list, templates, tour, help */
.op{max-width:960px}
.status>div{min-width:0}
.status .big{overflow-wrap:anywhere}
.tl .seg{cursor:pointer}
.tl .seg.sel{outline:3px solid var(--tx);outline-offset:-3px;z-index:2;filter:brightness(1.1)}
.pill .dot{width:10px;height:10px}
.now-list .it{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;flex-wrap:wrap}
.now-list .it:first-child{border-top:0;padding-top:0}
.now-list .it .ic{width:44px;height:44px}
.now-list .it .ic svg{width:22px;height:22px}
.now-list .it .t{flex:1;min-width:200px}
.now-list .it .t small{display:block;color:var(--mu);font-size:14.5px}
.unt-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);font-size:18px}
.unt-row:first-of-type{border-top:0}
.unt-row .tm{color:var(--mu);font-variant-numeric:tabular-nums}
.unt-row .btn{margin-left:auto;font-size:16px;padding:10px 18px}
.unt-row .reasons{flex-basis:100%}
.reasons.sm .rbtn{min-height:64px;font-size:17px;background:var(--inner);box-shadow:none}
.tplc{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;background:var(--inner)}
.tplc .n{font-size:30px;font-weight:800;line-height:1.1}
.tplc .n small{font-size:16px;font-weight:500;color:var(--mu)}
.tplc .l{font-size:15px;color:var(--mu)}
.vic.neu{background:var(--soft);color:var(--tx)}

/* demo strip extras */
.demo-bar .right{margin-left:auto;display:flex;gap:8px}
.dbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14.5px;font-weight:600}
.dbtn:hover{background:rgba(255,255,255,.14)}
.ctl button{white-space:nowrap}.shl{display:none}

/* guided tour */
#tour{position:fixed;inset:0;z-index:100}
#tour .catch{position:absolute;inset:0}
#tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(10,14,18,.7);transition:all .25s ease;pointer-events:none}
#tour .tip{position:fixed;width:min(400px,calc(100vw - 24px));background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.28);transition:top .25s ease,left .25s ease}
#tour .tip h3{margin:0 0 6px;font-size:19px}
#tour .tip p{margin:0 0 16px;font-size:16px;color:var(--mu)}
#tour .tip .bar2{display:flex;align-items:center;gap:8px}
#tour .tip .cnt{color:var(--mu);font-size:14px;margin-right:auto}

/* help drawer */
#help{position:fixed;inset:0;z-index:90;display:none}
#help.open{display:block}
#help .bk{position:absolute;inset:0;background:rgba(10,14,18,.45)}
#help .pnl{position:absolute;right:0;top:0;bottom:0;width:min(540px,100vw);background:var(--card);overflow:auto;padding:22px 24px 40px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
#help .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#help h2{font-size:24px;margin:0;flex:1}
#help h3{font-size:17px;margin:24px 0 8px}
#help p,#help li{font-size:15.5px;color:var(--mu);margin:6px 0}
#help b{color:var(--tx)}
#help ul{padding-left:20px;margin:6px 0}
#help .lg{display:grid;grid-template-columns:14px 1fr;gap:8px 10px;align-items:start;font-size:15.5px;color:var(--mu)}
#help .lg i{width:14px;height:14px;border-radius:4px;margin-top:4px}

@media(max-width:1100px){
  .shell{grid-template-columns:1fr;padding:10px}.side{display:none}.main{padding:0;border-radius:0}
  .kpis{grid-template-columns:1fr 1fr}.two,.tp{grid-template-columns:1fr}
  .chg .row{grid-template-columns:110px 1fr 1fr 100px}
}
/* phones: operator and foreman views must work from 360 px */
@media(max-width:640px){
  .demo-bar{padding:8px 12px;gap:8px 10px;font-size:13.5px}.ctl>span{display:none}.ctl button{padding:5px 10px;font-size:13.5px}
  .demo-bar .right{margin-left:0}.lgl{display:none}.shl{display:inline}.dbtn{padding:5px 12px;font-size:13.5px}
  .shell{padding:8px}.search{display:none}.hm{display:none!important}
  .ph h1{font-size:26px}.ph .meta{margin-left:0}
  .card{padding:16px;border-radius:18px}.ch h2{font-size:18px}
  .kpis{grid-template-columns:1fr}.kpi .val{font-size:30px}

<body>
<div class="demo-bar">
  <span class="tag">Демо-данные</span>
  <div class="ctl" data-tour="demo"><span>Роль</span><div id="roles"></div></div>
  <div class="ctl"><span>Линия сейчас</span><div id="scens"></div></div>
  <div class="right"><button class="dbtn" data-tourstart="1">Тур по экрану</button><button class="dbtn" data-help="1" data-tour="help">Пояснения</button></div>
</div>
<div id="app"></div>
<div id="help"></div>

<script>
// ---- demo scenario (minutes from 08:00) ----
var T0=480, SH=720, NOW=700, PLAN=520, SETUP_NORM=20; // PLAN and SETUP_NORM: demo values, real ones to be confirmed
// states follow the signal map of the line (priority order there); "unconf": rule not yet checked on the line
var ST={
  0:{n:"Нет данных",          big:"НЕТ ДАННЫХ",     lc:"нет данных",            c:"--nodata",g:null,            d:"Обрыв связи с ПЛК. Не простой: в потери и «% в работе» не входит."},
  1:{n:"Работа",              big:"РАБОТАЕТ",       lc:"работа",                c:"--ok",    g:null,            d:"Линия выпускает карты."},
  2:{n:"Стоп",                big:"СТОП",           lc:"стопы без причины",     c:"--idle",  g:"Причина не указана", d:"Нажата кнопка «Стоп». Почему — знает только оператор, поэтому его просят указать причину."},
  3:{n:"Пауза",               big:"ПАУЗА",          lc:"паузы",                 c:"--pause", g:"Материал", unconf:true, d:"Линия ждёт поперечную заготовку. Определяется по сигналам ПЛК, правило ещё проверяется."},
  8:{n:"Ожидание материала",  big:"ЖДЁМ МАТЕРИАЛ",  lc:"ожидание материала",    c:"--wait",  g:"Материал", unconf:true, d:"Нет заготовки дольше 20 секунд. Гипотеза, проверяется на линии."},
  4:{n:"Переналадка",         big:"ПЕРЕНАЛАДКА",    lc:"переналадка",           c:"--setup", g:"Плановое",      d:"Смена шаблона. Плановая работа, но считается против нормы: превышение — потеря."},
  5:{n:"Тепловая защита",     big:"ТЕПЛОВАЯ ЗАЩИТА",lc:"тепловая защита",       c:"--heat",  g:"Предупреждения",d:"Сработала тепловая защита контактора. Показывается как предупреждение, а не авария."},
  6:{n:"Авария привода",      big:"АВАРИЯ",         lc:"авария привода",        c:"--fault", g:"Аварии",        d:"Авария сервопривода или преобразователя частоты."},
  7:{n:"Аварийный стоп",      big:"АВАРИЙНЫЙ СТОП", lc:"аварийный стоп",        c:"--estop", g:"Аварии",        d:"Нажата кнопка аварийного останова."}
};
var ORDER=[1,2,3,8,4,5,6,7,0];
var BASE=[[0,95,1],[95,102,3],[102,170,1],[170,185,2],[185,215,4],[215,300,1],[300,318,6],[318,330,0],[330,400,1],[400,420,2],[420,505,1],[505,512,5],[512,600,1],[600,606,8],[606,700,1]];
var why={0:"Обрыв связи с ПЛК — не простой",3:"Нет поперечной заготовки",8:"Нет заготовки дольше 20 с",2:"Нажата кнопка «Стоп»",4:"Смена шаблона №12 → №27",6:"Авария сервопривода каретки 2",5:"Сработала тепловая защита: перегрев контактора К4"};
var TPLS=[[0,185,"№12","--tpl1"],[185,215,"","--setup"],[215,700,"№27","--tpl2"]];
// reasons the PLC cannot see — the operator picks them (list to be confirmed with the plant); third value: planned, not a loss
var REASONS=[["Обрыв прутка / проволоки","Оборудование"],["Заедание прутка","Оборудование"],["Замена бунта","Материал"],["Логистика","Материал"],["Брак сварки / ручная правка","Качество"],["Нет оператора","Персонал"],["Обед / перерыв","Плановое",true],["Другое","Прочее"]];
var GROUPS=["Аварии","Предупреждения","Оборудование","Материал","Качество","Персонал","Прочее","Причина не указана","Плановое"];
var R12=142/163, R27=318/434;           // cards per minute while the line runs
function rateAt(m){return m<185?R12:R27}
function tplAt(m){return m<185?"12":"27"}

var ROLES=[["op","Оператор","ОП","Оператор"],["foreman","Начальник участка","НУ","Начальник"],["boss","Директор / собственник","ДР","Директор"]];
var SCENS=[["run","Работает"],["stop","Станок стоит"]];
var role=(location.hash||"").slice(1),scen="run",tags={},openTag=null,evFilter="all",selSeg=null;
if(!ROLES.some(function(r){return r[0]==role}))role="foreman";

// ---- icons (simple strokes) ----
var IC={
  box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  speed:'<path d="M4 16a8 8 0 1 1 16 0"/><path d="m12 16 4-5"/><circle cx="12" cy="16" r="1.2"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  warn:'<path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17.5v.01"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/>',
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  line:'<path d="M3 17h18M5 17V9l4 3V9l4 3V9l4 3v5"/>',
  bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  play:'<path d="M8 5v14l11-7z"/>',
  swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>'
};
function ic(n){return '<svg class="i" viewBox="0 0 24 24">'+IC[n]+'</svg>'}

function $(id){return document.getElementById(id)}
function cv(n){return "var("+n+")"}
function hm(m){var t=T0+m;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function dur(m){var h=Math.floor(m/60);return h?h+" ч "+(m%60)+" мин":m+" мин"}
function pct(m){return m/SH*100}
function plural(n,a,b,c){var m=n%10,mm=n%100;return m==1&&mm!=11?a:m>=2&&m<=4&&(mm<12||mm>14)?b:c}
function reasonInfo(r){return REASONS.filter(function(x){return x[0]==r})[0]}
function segGroup(s){var t=s[2]==2&&tags[s[0]];return t?reasonInfo(t)[1]:ST[s[2]].g}
function srcHTML(st,tag){if(st==0)return "";return (tag?'<span class="src opr">Оператор</span>':'<span class="src">ПЛК</span>')+(!tag&&ST[st].unconf?' <span class="tbd">не подтверждено</span>':'')}
var TBD=' <span class="tbd">демо, уточняется</span>', EST=' <span class="tbd">оценка</span>';

// ---- model: everything is derived from the segments and the operator's tags ----
function model(){
  var seg=BASE.map(function(s){return s.slice()});
  if(scen=="stop"){seg[seg.length-1]=[606,685,1];seg.push([685,700,2])}
  var M={seg:seg,work:0,done:0,nodata:0,items:{},byState:{},tpl:{"12":{work:0,nd:0,cards:0},"27":{work:0,nd:0,cards:0}}};
  seg.forEach(function(s){
    var d=s[1]-s[0];
    M.byState[s[2]]=(M.byState[s[2]]||0)+d;
    if(s[2]==1||s[2]==0){     // during "no data" the PLC card counter keeps counting and catches up after the link is back
      var t=M.tpl[tplAt(s[0])];t.cards+=d*rateAt(s[0]);M.done+=d*rateAt(s[0]);
      if(s[2]==1){M.work+=d;t.work+=d}else{M.nodata+=d;t.nd+=d}
      return;
    }
    var tag=s[2]==2?tags[s[0]]:null,ri=tag&&reasonInfo(tag);
    var key=s[2]==2?(tag?"t:"+tag:"s2"):"s"+s[2];
    var it=M.items[key]||(M.items[key]={key:key,st:s[2],label:tag||ST[s[2]].n,min:0,cards:0,
      group:tag?ri[1]:ST[s[2]].g,planned:s[2]==4||!!(ri&&ri[2])});
    it.min+=d;it.cards+=d*rateAt(s[0]);
  });
  M.done=Math.round(M.done);
  M.tpl["12"].n=Math.round(M.tpl["12"].cards);M.tpl["27"].n=M.done-M.tpl["12"].n;
  M.list=Object.keys(M.items).map(function(k){var it=M.items[k];
    it.lost=it.st==4?Math.max(0,it.min-SETUP_NORM):(it.planned?0:it.min);
    it.lostCards=it.cards*it.lost/it.min;return it});
  M.unplanned=M.list.reduce(function(a,i){return a+i.lost},0);
  M.setup=(M.items.s4||{min:0}).min;
  M.planNow=Math.round(PLAN*NOW/SH);
  M.gap=M.planNow-M.done;
  M.forecast=Math.round(M.done+(SH-NOW)*R27);
  M.perHour=M.done/(NOW/60);
  M.known=NOW-M.nodata;
  M.util=Math.round(M.work/M.known*100);
  M.changes=seg.filter(function(s){return s[2]==4}).map(function(s){return {a:s[0],b:s[1],d:s[1]-s[0],from:"№12",to:"№27"}});
  M.over=M.changes.reduce(function(a,c){return a+Math.max(0,c.d-SETUP_NORM)},0);
  M.cur=seg[seg.length-1];
  M.curDur=NOW-M.cur[0];
  M.untagged=seg.filter(function(s){return s[2]==2&&!tags[s[0]]});
  M.present=ORDER.filter(function(k){return M.byState[k]});
  M.hours=[];
  for(var h=0;h<12;h++){
    var a=h*60,b=Math.min(a+60,NOW),fact=0,cap=0;
    for(var m=a;m<b;m++){cap+=rateAt(m);seg.forEach(function(g){if((g[2]==1||g[2]==0)&&m>=g[0]&&m<g[1])fact+=rateAt(m)})}
    M.hours.push({h:h,fact:fact,cap:cap,partial:b-a<60,future:b<=a});
  }
  return M;
}

// ---- blocks ----
function lc(it){return it.st==2&&it.key!="s2"?it.label.toLowerCase():ST[it.st].lc}
function statusPill(M){
  var c=M.cur;
  return '<span class="pill"><i class="dot" style="background:'+cv(ST[c[2]].c)+'"></i><b>'+(c[2]==1?"Работает":ST[c[2]].n)+'</b> '+dur(M.curDur)+'</span>';
}
function lossesLine(M){
  var top=M.list.filter(function(i){return i.lost>0}).sort(function(a,b){return b.lost-a.lost}),w="";
  if(top.length>1)w="Главные потери: <b>"+lc(top[0])+" "+top[0].lost+" мин</b>"+(top[0].key=="s2"?" (причина не указана)":"")+" и <b>"+lc(top[1])+" "+top[1].lost+" мин</b>. ";
  return w+"Переналадка — <b>"+M.setup+" мин</b> при норме "+SETUP_NORM+(M.over?" (+"+M.over+")":"")+".";
}
// director: the result of the shift in one line
function verdict(M){
  var head="К 19:40 сделано "+M.done+" карт при графике "+M.planNow+(M.gap>0?" (−"+M.gap+")":"")+". Прогноз к концу смены ≈ "+M.forecast+" из "+PLAN+".";
  return '<section class="card verdict mb" data-tour="verdict"><div class="vic neu">'+ic("target")+'</div><div>'+
    '<div class="head">'+head+'</div><div class="why">'+lossesLine(M)+' План'+TBD+'</div></div></section>';
}
// foreman: what needs action right now
function nowCard(M){
  var c=M.cur,items=[];
  items.push('<div class="it"><span class="ic" style="--c:'+cv(ST[c[2]].c)+'">'+ic(c[2]==1?"play":"stop")+'</span><div class="t"><b>'+(c[2]==1?"Линия работает":"Линия стоит: "+ST[c[2]].n.toLowerCase())+'</b> · '+dur(M.curDur)+'<small>шаблон №27 · сделано '+M.done+' карт, по графику '+M.planNow+'</small></div></div>');
  if(M.untagged.length){
    var min=M.untagged.reduce(function(a,s){return a+s[1]-s[0]},0);
    items.push('<div class="it"><span class="ic" style="--c:var(--pause)">'+ic("warn")+'</span><div class="t"><b>Нужно указать причину: '+M.untagged.length+' '+plural(M.untagged.length,"остановка","остановки","остановок")+' ('+min+' мин)</b><small>Без причины эти минуты не отнести ни к оборудованию, ни к материалу.</small></div><button class="btn" data-filter="Причина не указана" data-jump="1">Показать</button></div>');
  }
  if(M.over)items.push('<div class="it"><span class="ic" style="--c:var(--setup)">'+ic("swap")+'</span><div class="t"><b>Переналадка превысила норму на '+M.over+' мин</b><small>'+M.setup+' мин при норме '+SETUP_NORM+'</small></div></div>');
  return '<section class="card now-list mb" data-tour="now"><div class="ch"><h2>Сейчас на линии</h2></div>'+items.join("")+'</section>';
}
function kpi(icon,color,val,lbl,foot,extra){
  return '<div class="card kpi"><div class="row"><span class="ic" style="--c:'+cv(color)+'">'+ic(icon)+'</span><div><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div></div>'+(extra||'')+'<div class="foot">'+foot+'</div></div>';
}
function kpis(M){
  var ph=PLAN/12;
  return '<div class="grid kpis" data-tour="kpis">'+
   kpi("box","--ok",M.done+' <small>из '+PLAN+'</small>',"Выпущено карт",
     '<span class="delta '+(M.gap>0?'bad':'okc')+'">'+(M.gap>0?'↘ −'+M.gap:'↗ +'+(-M.gap))+'</span> к графику на 19:40 · план'+TBD,
     '<div class="track"><i style="width:'+M.done/PLAN*100+'%"></i><em style="left:'+M.planNow/PLAN*100+'%"></em></div>')+
   kpi("speed","--blue-d",M.perHour.toFixed(0)+' <small>карт/час</small>',"Темп",
     '<span class="delta '+(M.perHour<ph?'bad':'okc')+'">'+(M.perHour<ph?'↘ ':'↗ ')+(M.perHour-ph).toFixed(0)+'</span> к плану '+ph.toFixed(0)+' карт/час')+
   kpi("clock","--ok",M.util+'%',"Время в работе",
     dur(M.work)+' из '+dur(M.known)+(M.nodata?' · '+M.nodata+' мин без связи не считаем':''))+
   kpi("swap","--setup",M.setup+' <small>мин</small>',"Переналадки",
     '<span class="delta '+(M.over?'bad':'okc')+'">'+(M.over?'+'+M.over+' к норме':'в норме')+'</span> норма '+SETUP_NORM+' мин'+TBD)+
   '</div>';
}
function timeline(M,title,subtitle){
  var h='<section class="card mb" data-tour="timeline"><div class="ch"><h2>'+title+'</h2><div class="r hm"><span class="ghost">08:00–20:00</span></div><div class="sub">'+subtitle+'</div></div><div class="tlwrap"><div class="tl">';
  M.seg.forEach(function(s,i){h+='<div class="seg'+(selSeg===i?' sel':'')+'" data-i="'+i+'" style="left:'+pct(s[0])+'%;width:'+pct(s[1]-s[0])+'%;background:'+cv(ST[s[2]].c)+'"></div>'});
  h+='</div><div class="tpl">';
  TPLS.forEach(function(t){h+='<div class="seg" style="left:'+pct(t[0])+'%;width:'+pct(t[1]-t[0])+'%;background:'+cv(t[3])+'">'+t[2]+'</div>'});
  h+='</div><div class="axis">';
  for(var i=0;i<=12;i+=2)h+='<span class="'+(i%4?'odd':'')+'" style="left:'+pct(i*60)+'%">'+hm(i*60)+'</span>';
  h+='</div><div class="nowline" style="left:calc('+pct(NOW)+'% - 1px)"></div></div>'+
     '<div class="readout" id="readout">'+readoutHTML(M)+'</div><div class="legend">';
  M.present.forEach(function(k){h+='<span><i style="background:'+cv(ST[k].c)+'"></i>'+ST[k].n+'</span>'});
  return h+'<span><i style="background:var(--soft);outline:1px solid var(--line)"></i>Ещё не наступило</span></div></section>';
}
function readoutHTML(M){
  if(selSeg==null||!M.seg[selSeg])return "Нажмите на участок ленты — покажу время и причину.";
  var g=M.seg[selSeg],tag=g[2]==2?tags[g[0]]:null;
  return "<b>"+hm(g[0])+"–"+hm(g[1])+"</b> · "+ST[g[2]].n+(tag?" — "+tag:why[g[2]]?" — "+why[g[2]]:"")+" · "+dur(g[1]-g[0])+(g[2]==1?" · шаблон №"+tplAt(g[0]):"");
}
function templates(M){
  var rows=[["12","--tpl1"],["27","--tpl2"]].map(function(t){
    var o=M.tpl[t[0]],run=o.work+o.nd;
    return '<div class="tplc"><div class="tbadge" style="background:'+cv(t[1])+'">№'+t[0]+'</div><div>'+
      '<div class="n">'+o.n+' <small>карт</small></div>'+
      '<div class="l">в работе '+dur(o.work)+(o.nd?' + '+o.nd+' мин без связи':'')+' · '+Math.round(o.n/run*60)+' карт/час</div>'+
      '<div class="l">название <span class="tbd">уточняется</span></div></div></div>';
  }).join("");
  return '<section class="card mb" data-tour="templates"><div class="ch"><h2>Выпуск по шаблонам</h2><div class="sub">Какой шаблон работал и сколько карт на нём сделано. Карты за минуты без связи досчитаны по счётчику ПЛК.</div></div><div class="grid tp" style="margin:0">'+rows+'</div></section>';
}
function hourly(M){
  var W=640,H=260,L=36,R=8,Tp=12,B=30,pw=W-L-R,ph=H-Tp-B,YM=60,s="";
  var bw=pw/12,X=function(h){return L+h*bw},Y=function(v){return Tp+ph-v/YM*ph},planH=PLAN/12;
  [0,15,30,45,60].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  M.hours.forEach(function(o){
    var x=X(o.h)+bw*.2,w=bw*.6;
    if(!o.future){
      s+='<rect x="'+x+'" y="'+Y(o.cap)+'" width="'+w+'" height="'+(Y(0)-Y(o.cap))+'" rx="6" fill="var(--blue)" opacity=".45"/>';
      s+='<rect x="'+x+'" y="'+Y(o.fact)+'" width="'+w+'" height="'+(Y(0)-Y(o.fact))+'" rx="6" fill="var(--blue-d)"/>';
      if(o.partial)s+='<text x="'+(x+w/2)+'" y="'+(Y(o.cap)-6)+'" text-anchor="middle">идёт</text>';
    }

function losses(M){

function startTour(){
  closeHelp();
  tour={steps:TOURS[role],i:0};
  if(!$("tour")){var d=document.createElement("div");d.id="tour";d.innerHTML='<div class="catch"></div><div class="spot"></div><div class="tip"></div>';document.body.appendChild(d)}
  showStep(0);
}
function showStep(i){
  if(!tour)return;
  if(i<0)i=0;
  if(i>=tour.steps.length){endTour();return}
  var st=tour.steps[i];
  if(st[3])st[3]();
  if(!tourEl(st[0])){showStep(i+(i>=tour.i?1:-1));return}   // block not on this screen — skip it
  tour.i=i;
  var el=tourEl(st[0]),tip=document.querySelector("#tour .tip");
  if(el.closest(".demo-bar"))window.scrollTo(0,0);else el.scrollIntoView({block:"center"});
  tip.innerHTML='<h3>'+st[1]+'</h3><p>'+st[2]+'</p><div class="bar2"><span class="cnt">'+(i+1)+' из '+tour.steps.length+'</span>'+
    (i?'<button class="btn lt" data-tstep="-1">Назад</button>':'<button class="btn lt" data-tend="1">Пропустить</button>')+
    '<button class="btn" data-tstep="1">'+(i==tour.steps.length-1?'Готово':'Далее')+'</button></div>';
  placeTour();
}
function placeTour(){
  if(!tour)return;
  var el=tourEl(tour.steps[tour.i][0]);if(!el)return;
  var r=el.getBoundingClientRect(),p=8,spot=document.querySelector("#tour .spot"),tip=document.querySelector("#tour .tip");
  var top=Math.max(r.top-p,4),bottom=Math.min(r.bottom+p,innerHeight-4);
  spot.style.left=(r.left-p)+"px";spot.style.top=top+"px";spot.style.width=(r.width+2*p)+"px";spot.style.height=(bottom-top)+"px";
  var tw=tip.offsetWidth,th=tip.offsetHeight,tl=Math.min(Math.max(12,r.left),innerWidth-tw-12),tt;
  if(bottom+12+th<innerHeight)tt=bottom+12;else if(top-12-th>0)tt=top-12-th;else tt=innerHeight-th-12;
  tip.style.left=tl+"px";tip.style.top=tt+"px";
}
function endTour(){tour=null;var t=$("tour");if(t)t.remove()}
function openHelp(){var h=$("help");h.innerHTML=helpHTML();h.classList.add("open")}
function closeHelp(){$("help").classList.remove("open")}

// ---- render & events ----
var M_;
function render(){
  M_=model();
  $("app").innerHTML=role=="op"?viewOperator(M_):role=="foreman"?viewForeman(M_):viewBoss(M_);
  $("roles").innerHTML=ROLES.map(function(r){return '<button data-role="'+r[0]+'" class="'+(r[0]==role?"on":"")+'"><span class="lgl">'+r[1]+'</span><span class="shl">'+r[3]+'</span></button>'}).join("");
  $("scens").innerHTML=SCENS.map(function(r){return '<button data-scen="'+r[0]+'" class="'+(r[0]==scen?"on":"")+'">'+r[1]+'</button>'}).join("");
}
document.addEventListener("click",function(e){
  var seg=e.target.closest(".tl .seg");
  if(seg&&!tour){selSeg=+seg.dataset.i===selSeg?null:+seg.dataset.i;render();return}
  var b=e.target.closest("button,[data-help]");if(!b)return;
  var d=b.dataset;
  if(d.tstep){showStep(tour.i+(+d.tstep));return}
  if(d.tend){endTour();return}
  if(d.tourstart){startTour();return}
  if(d.help){$("help").classList.contains("open")?closeHelp():openHelp();return}
  if(d.role){role=d.role;try{history.replaceState(null,"","#"+role)}catch(x){}openTag=null;selSeg=null}
  else if(d.scen){scen=d.scen;openTag=null;selSeg=null}
  else if(d.tag){tags[+d.start]=d.tag;openTag=null}
  else if(d.untag){delete tags[+d.untag]}
  else if(d.open){openTag=openTag===+d.open?null:+d.open}
  else if(d.filter){evFilter=d.filter}
  else return;
  render();
  if(d.jump){var t=document.querySelector(".tabs");if(t)t.scrollIntoView({behavior:"smooth",block:"center"})}
});
document.addEventListener("keydown",function(e){
  if(tour){if(e.key=="Escape")endTour();else if(e.key=="ArrowRight")showStep(tour.i+1);else if(e.key=="ArrowLeft")showStep(tour.i-1)}
  else if(e.key=="Escape")closeHelp();
});
addEventListener("resize",placeTour);
addEventListener("scroll",placeTour,{passive:true});
render();
// first visit: start the tour once
var seen=false;try{seen=localStorage.getItem("cesis2-tour")=="1";localStorage.setItem("cesis2-tour","1")}catch(x){}
if(!seen)setTimeout(startTour,500);
</script>
</body>
