<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Линия Цесис 2 — смена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOKENS — 8 pt grid (4 only for tight gaps), type scale on a 4 pt baseline.
   Touch targets: 48 (covers Apple 44 pt and Material 48 dp).
   ===================================================================== */
:root{
  /* color */
  --bg:#E6EAEB;--side:#F4F6F6;--card:#FFFFFF;--inner:#F3F5F6;--line:#E2E6E8;--tx:#14181D;--mu:#5A636E;--soft:#ECEFF1;--ink:#121519;--ink-tx:#FFFFFF;
  --ok:#2F8F63;--idle:#6E7A89;--pause:#D99A16;--wait:#B5835A;--setup:#7A62D6;--heat:#E57A2E;--fault:#D2433A;--estop:#8A1F1F;--nodata:#C5CBD1;
  --blue:#8CCDEB;--blue-d:#2E9BD0;--warn-bg:#FFF2CC;--warn-tx:#634700;--tpl1:#3F6FD1;--tpl2:#22899B;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.04);
  /* spacing */
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:40px;--s7:48px;--s8:56px;--s9:64px;
  /* radius */
  --r1:8px;--r2:16px;--r3:24px;--rp:999px;
  /* size */
  --tap:48px;--icon:24px;--tabbar:64px;--rail:80px;--sidew:288px;
  /* page gutter: 16 on phones, 24 on tablets and desktop */
  --gut:24px;
  /* type: size / line-height */
  --t-cap:12px/16px;--t-sm:14px/20px;--t-body:16px/24px;--t-lg:18px/24px;--t-ttl:20px/28px;--t-h3:24px/32px;--t-h2:32px/40px;--t-d1:40px/48px;--t-d2:56px/64px;--t-d3:72px/80px;
  /* safe area at the bottom (home indicator) */
  --safe-b:env(safe-area-inset-bottom,0px);
  --ff:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--t-body) Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}

/* =====================================================================
   ATOMS
   ===================================================================== */
svg.i{width:var(--icon);height:var(--icon);flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
/* buttons: 48 tall on every device */
.btn{min-height:var(--tap);border:0;background:var(--ink);color:var(--ink-tx);border-radius:var(--rp);padding:0 var(--s4);cursor:pointer;font:600 var(--t-body) var(--ff);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap}
.btn.lt{background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.ibtn{width:var(--tap);height:var(--tap);border:0;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);position:relative;color:var(--tx);cursor:pointer}
.ibtn .ndot{position:absolute;top:var(--s2);right:var(--s2);width:var(--s2);height:var(--s2);border-radius:50%;background:var(--fault);box-shadow:0 0 0 2px var(--card)}
.ava{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--ink);color:var(--ink-tx);display:grid;place-items:center;font:700 var(--t-sm) var(--ff)}
.chip{min-height:var(--tap);border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);border-radius:var(--rp);padding:0 var(--s3);cursor:pointer;font:600 var(--t-body) var(--ff)}
.chip:hover{box-shadow:inset 0 0 0 2px var(--tx)}
.pill{min-height:40px;background:var(--card);border-radius:var(--rp);padding:0 var(--s3);font:var(--t-sm) var(--ff);color:var(--mu);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:var(--s2)}
.pill b{color:var(--tx);font-weight:600}
.ghost{min-height:32px;display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);border-radius:var(--rp);padding:0 var(--s3);font:var(--t-sm) var(--ff);color:var(--mu)}
.badge{display:inline-flex;white-space:nowrap;align-items:center;gap:var(--s2);min-height:32px;border-radius:var(--rp);padding:0 var(--s3);font:600 var(--t-sm) var(--ff);background:color-mix(in srgb,var(--c) 15%,var(--card));color:color-mix(in srgb,var(--c) 80%,var(--tx))}
.badge i{width:var(--s2);height:var(--s2);border-radius:50%;background:var(--c)}
.src{display:inline-flex;align-items:center;min-height:24px;border-radius:var(--r1);padding:0 var(--s2);font:600 var(--t-cap) var(--ff);background:var(--soft);color:var(--mu);white-space:nowrap}
.src.opr{background:color-mix(in srgb,var(--blue-d) 14%,var(--card));color:#1F6E96}
.tbd{display:inline-flex;align-items:center;min-height:24px;box-shadow:inset 0 0 0 1px var(--mu);border-radius:var(--r1);padding:0 var(--s2);font:600 var(--t-cap) var(--ff);color:var(--mu);white-space:nowrap}
.unk{display:inline-flex;align-items:center;min-height:24px;color:var(--warn-tx);background:var(--warn-bg);border-radius:var(--rp);padding:0 var(--s2);font:600 var(--t-cap) var(--ff)}
.ic{width:var(--s8);height:var(--s8);border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
.ic.sm{width:var(--tap);height:var(--tap)}
.delta{font-weight:700;display:inline-flex;align-items:center;gap:var(--s1)}
.bad{color:var(--fault)}.okc{color:var(--ok)}.wrn{color:var(--pause)}
.track{position:relative;height:var(--s2);border-radius:var(--s1);background:var(--soft);margin-top:var(--s3)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--s1);background:var(--ok)}
.track em{position:absolute;top:calc(-1*var(--s1));bottom:calc(-1*var(--s1));width:4px;border-radius:2px;background:var(--tx)}

/* =====================================================================
   MOLECULES
   ===================================================================== */
/* card + card header */
.card{background:var(--card);border-radius:var(--r3);padding:var(--s4);box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:var(--s2) var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.ch h2{font:700 var(--t-ttl) var(--ff)}
.ch .sub{color:var(--mu);font:var(--t-sm) var(--ff);width:100%}
.ch .r{margin-left:auto;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.sub{color:var(--mu);font:var(--t-sm) var(--ff)}
/* KPI */
.kpi .row{display:flex;gap:var(--s3);align-items:center}
.kpi .val{font:800 var(--t-h2) var(--ff);letter-spacing:-.01em}
.kpi .val small{font:500 var(--t-lg) var(--ff);color:var(--mu)}
.kpi .lbl{font:var(--t-sm) var(--ff);color:var(--mu)}
.kpi .foot{border-top:1px solid var(--line);margin-top:var(--s3);padding-top:var(--s3);font:var(--t-sm) var(--ff);color:var(--mu);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
/* nav items */
.nav{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:0 var(--s3);border-radius:var(--rp);color:var(--mu);font:500 var(--t-body) var(--ff);border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:var(--soft)}
.nav .cnt{margin-left:auto;background:var(--fault);color:#fff;border-radius:var(--rp);font:700 var(--t-cap) var(--ff);padding:2px var(--s2)}
.grp-h{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:var(--s8);border:0;background:transparent;padding:var(--s2) var(--s3);border-radius:var(--r2);cursor:pointer;font:650 var(--t-body) var(--ff);color:var(--tx);text-align:left}
.grp-h:hover{background:var(--soft)}
.grp-h small{display:block;color:var(--mu);font:500 var(--t-sm) var(--ff)}
.grp-h svg{width:var(--s3);height:var(--s3);transition:transform .2s}
.grp-h.cl svg{transform:rotate(-90deg)}
.nl{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:var(--tap);border:0;background:transparent;padding:0 var(--s3) 0 var(--s5);border-radius:var(--rp);cursor:pointer;font:var(--t-body) var(--ff);color:var(--tx);text-align:left}
.nl:hover{background:var(--soft)}
.nl.on{background:var(--ink);color:var(--ink-tx);font-weight:600}
.nl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl .sw{font:600 var(--t-cap) var(--ff);white-space:nowrap}
.nl.on .sw{color:rgba(255,255,255,.75)}
.nl .dot{width:var(--s2);height:var(--s2)}
.nl.on .dot{box-shadow:0 0 0 2px var(--ink),0 0 0 4px rgba(255,255,255,.7)}
/* loss row */
.loss{display:grid;grid-template-columns:minmax(120px,168px) 1fr 104px;gap:var(--s3);align-items:center;padding:var(--s2) 0;border-top:1px solid var(--line);min-height:var(--s8)}
.loss .nm{font:600 var(--t-body) var(--ff)}
.loss .nm small{display:flex;gap:var(--s1);flex-wrap:wrap;color:var(--mu);font:400 var(--t-sm) var(--ff);margin-top:var(--s1)}
.loss .bar{position:relative;height:var(--s3);background:var(--soft);border-radius:var(--r1);overflow:hidden}
.loss .bar b{display:block;height:100%;border-radius:var(--r1)}
.loss .bar em{position:absolute;top:0;bottom:0;width:4px;background:var(--tx)}
.loss .num{text-align:right;font:700 var(--t-body) var(--ff);font-variant-numeric:tabular-nums}
.loss .num small{display:block;color:var(--mu);font:400 var(--t-sm) var(--ff)}
.grp{font:700 var(--t-cap) var(--ff);text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:var(--s3) 0 var(--s1)}
/* event row */
.tr{display:grid;grid-template-columns:136px 224px minmax(0,1fr) 96px 112px;gap:var(--s3);align-items:center;padding:var(--s2) var(--s3);min-height:var(--s9);font:var(--t-body) var(--ff)}
.tr.th{font:var(--t-sm) var(--ff);color:var(--mu);min-height:var(--s5)}
.tr.row{background:var(--card);border-radius:var(--r2);margin-top:var(--s2)}
.tr .tm{font-variant-numeric:tabular-nums;color:var(--mu)}
.tr .d,.tr .c{text-align:right;font-variant-numeric:tabular-nums}
.tr .d{font-weight:700}
.tr .c{color:var(--mu)}
.tr .cause{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;color:var(--mu)}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s1) 0}
/* filter tabs (segmented chips) */
.tabs{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.tabs button{min-height:40px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);border-radius:var(--rp);padding:0 var(--s3);font:var(--t-sm) var(--ff);cursor:pointer;color:var(--mu)}
.tabs button.on{background:var(--ink);box-shadow:none;color:var(--ink-tx);font-weight:600}
.tabs button span{opacity:.6;margin-left:var(--s1)}
/* reason button (operator) */
.reasons{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.rbtn{min-height:80px;border:0;background:var(--card);color:var(--tx);border-radius:var(--r2);font:700 var(--t-lg) var(--ff);cursor:pointer;padding:var(--s2) var(--s3);box-shadow:var(--shadow)}
.rbtn:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.reasons.sm .rbtn{min-height:var(--s8);font:600 var(--t-body) var(--ff);background:var(--inner);box-shadow:none}
/* template tile */
.tplc{display:flex;gap:var(--s3);align-items:center;padding:var(--s3);border-radius:var(--r2);background:var(--inner)}
.tbadge{width:var(--s8);height:var(--s8);border-radius:var(--r2);color:#fff;font:800 var(--t-lg) var(--ff);display:grid;place-items:center;flex:none}
.tplc .n{font:800 var(--t-h2) var(--ff)}
.tplc .n small{font:500 var(--t-body) var(--ff);color:var(--mu)}
.tplc .l{font:var(--t-sm) var(--ff);color:var(--mu);display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap}
/* "now" row (foreman) */
.now-list .it{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line);flex-wrap:wrap}
.now-list .it:first-of-type{border-top:0;padding-top:0}
.now-list .it .t{flex:1;min-width:200px}
.now-list .it .t small{display:block;color:var(--mu);font:var(--t-sm) var(--ff)}
/* unresolved stop row (operator) */
.unt-row{display:flex;align-items:center;gap:var(--s2) var(--s3);flex-wrap:wrap;padding:var(--s3) 0;border-top:1px solid var(--line);font:var(--t-lg) var(--ff)}
.unt-row:first-of-type{border-top:0}
.unt-row .tm{color:var(--mu);font-variant-numeric:tabular-nums}
.unt-row .btn{margin-left:auto}
.unt-row .reasons{flex-basis:100%}
/* list row on phone pages ("More") */
.lrow{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--s8);border:0;background:transparent;border-top:1px solid var(--line);padding:0 var(--s2);font:var(--t-body) var(--ff);color:var(--tx);text-align:left;cursor:pointer}
.lrow:first-child{border-top:0}
.lrow .sp{flex:1}

/* =====================================================================
   ORGANISMS
   ===================================================================== */
/* timeline */
.tlwrap{position:relative;padding-top:var(--s1)}
.tl{position:relative;height:var(--s8);border-radius:var(--r1);overflow:hidden;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px)}
.tl .seg{position:absolute;top:0;bottom:0;cursor:pointer}
.tl .seg+.seg{box-shadow:inset 2px 0 0 var(--card)}
.tl .seg:hover,.tl .seg.sel{filter:brightness(1.1);outline:3px solid var(--tx);outline-offset:-3px;z-index:2}
.tpl{position:relative;height:var(--s5);margin-top:var(--s2);border-radius:var(--r1);overflow:hidden;background:var(--soft)}
.tpl .seg{position:absolute;top:0;bottom:0;color:#fff;font:600 var(--t-sm) var(--ff);display:flex;align-items:center;padding-left:var(--s2);white-space:nowrap;overflow:hidden}
.axis{position:relative;height:var(--s4);margin-top:var(--s2);font:var(--t-sm) var(--ff);color:var(--mu)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.nowline{position:absolute;top:0;bottom:var(--s4);width:4px;border-radius:2px;background:var(--tx);z-index:3}
.readout{min-height:var(--tap);display:flex;align-items:center;flex-wrap:wrap;gap:0 var(--s1);margin-top:var(--s3);color:var(--mu);background:var(--inner);border-radius:var(--r2);padding:var(--s2) var(--s3)}
.readout b{color:var(--tx)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);margin-top:var(--s3);font:var(--t-sm) var(--ff);color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:var(--s2)}
.legend i{width:12px;height:12px;border-radius:var(--s1);display:inline-block}
svg text{fill:var(--mu);font-size:13px;font-family:inherit}
/* donut */
.donut{display:grid;grid-template-columns:144px 1fr;gap:var(--s4);align-items:center;margin-bottom:var(--s2)}
.donut .c{position:relative;width:144px;height:144px}
.donut .c svg{width:144px;height:144px}
.donut .c div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:var(--t-sm) var(--ff);color:var(--mu)}
.donut .c div b{display:block;font:800 var(--t-h2) var(--ff);color:var(--tx)}
.donut ul{list-style:none;margin:0;padding:0;font:var(--t-sm) var(--ff)}
.donut li{display:flex;align-items:center;gap:var(--s2);min-height:var(--s5)}
.donut li span{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
/* events table */
.tbl{background:var(--inner);border-radius:var(--r2);padding:var(--s2)}
.empty{padding:var(--s4);text-align:center;color:var(--mu)}
/* alert / notice */
.alert{display:flex;gap:var(--s3);align-items:center;background:var(--warn-bg);color:var(--warn-tx)}
.alert h2{font:700 var(--t-lg) var(--ff)}
.alert .s{font:var(--t-sm) var(--ff)}
.alert .btn{margin-left:auto}
/* verdict (director) */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:center}
.vic{width:var(--s8);height:var(--s8);border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--tx)}
.verdict .head{font:700 var(--t-h3) var(--ff);margin-bottom:var(--s2)}
.verdict .why{color:var(--mu);font:var(--t-body) var(--ff)}
.verdict .why b{color:var(--tx);font-weight:600}
/* changeovers */
.chg{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:center}
.chg .tot{padding-right:var(--s4);border-right:1px solid var(--line)}
.chg .tot .v{font:800 var(--t-d1) var(--ff)}
.chg .tot .v small{font:500 var(--t-lg) var(--ff);color:var(--mu)}
.chg .tot .l{font:var(--t-sm) var(--ff);color:var(--mu);margin-top:var(--s1)}
.chg .row{display:grid;grid-template-columns:120px 1fr 280px 112px;gap:var(--s3);align-items:center;min-height:var(--s9);border-top:1px solid var(--line)}
.chg .row:first-child{border-top:0}
.chg .tpls{display:flex;align-items:center;gap:var(--s2);font-weight:600}
.chg .tpls i{font-style:normal;border-radius:var(--r1);color:#fff;padding:var(--s1) var(--s2);font:600 var(--t-sm) var(--ff)}
.nbar{position:relative;height:var(--s3);background:var(--soft);border-radius:var(--r1)}
.nbar b{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r1);background:var(--setup)}
.nbar b.over{background:var(--fault);border-radius:0 var(--r1) var(--r1) 0}
.nbar em{position:absolute;top:calc(-1*var(--s1));bottom:calc(-1*var(--s1));width:4px;border-radius:2px;background:var(--tx)}
/* operator status + progress */
.op{max-width:960px}
.status{border-radius:var(--r3);padding:var(--s5);color:#fff;margin-bottom:var(--s3);display:flex;align-items:center;gap:var(--s4)}
.status.old{opacity:.55;filter:grayscale(.4)}
.status>div{min-width:0}
.status .lbl{font:var(--t-lg) var(--ff);opacity:.9}
.status .big{font:800 var(--t-d3) var(--ff);letter-spacing:-.01em;overflow-wrap:anywhere}
.status .for{font:var(--t-h3) var(--ff);margin-top:var(--s1);opacity:.95}
.status .ring{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.status .ring svg{width:var(--s7);height:var(--s7);stroke-width:2.2}
.ask{background:var(--warn-bg)}
.ask h2{font:700 var(--t-h3) var(--ff);margin-bottom:var(--s3);color:var(--warn-tx)}
.done-r{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;font:700 var(--t-h3) var(--ff)}
.prog{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.prog .num{font:800 var(--t-d3) var(--ff);letter-spacing:-.02em}
.prog .of{font:var(--t-h3) var(--ff);color:var(--mu)}
.prog-t{position:relative;height:var(--s4);border-radius:var(--r2);background:var(--soft);margin:var(--s3) 0}
.prog-t i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r2);background:var(--ok)}
.prog-t em{position:absolute;top:calc(-1*var(--s2));bottom:calc(-1*var(--s2));width:4px;border-radius:2px;background:var(--tx)}
.prog-line{font:var(--t-lg) var(--ff)}
/* sidebar (expanded) */
.side{background:var(--side);border-radius:var(--r3) 0 0 var(--r3);padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s1);position:sticky;top:64px;align-self:start;height:calc(100vh - 80px);overflow-y:auto}
.logo{display:flex;align-items:center;gap:var(--s2);font:800 var(--t-ttl) var(--ff);padding:0 var(--s2) var(--s3)}
.logo b{width:40px;height:40px;border-radius:var(--r1);background:var(--ink);color:var(--ink-tx);display:grid;place-items:center;font:800 var(--t-body) var(--ff)}
.side .sec{font:700 var(--t-cap) var(--ff);text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:var(--s3) var(--s3) var(--s2)}
.navsep{height:1px;background:var(--line);margin:var(--s2)}

function $(id){return document.getElementById(id)}
function cv(n){return "var("+n+")"}
function hm(m){var t=T0+m;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function dur(m){var h=Math.floor(m/60);return h?h+" ч "+(m%60)+" мин":m+" мин"}
function pct(m){return m/SH*100}
function plural(n,a,b,c){var m=n%10,mm=n%100;return m==1&&mm!=11?a:m>=2&&m<=4&&(mm<12||mm>14)?b:c}
function reasonInfo(r){return REASONS.filter(function(x){return x[0]==r})[0]}
function segGroup(s){var t=s[2]==2&&tags[s[0]];return t?reasonInfo(t)[1]:ST[s[2]].g}

var TBD=' <span class="tbd">демо, уточняется</span>', EST=' <span class="tbd">оценка</span>';

// ---- model: everything is derived from the segments and the operator's tags ----
function model(){
  var seg=BASE.map(function(s){return s.slice()});
  if(scen=="stop"){seg[seg.length-1]=[606,685,1];seg.push([685,700,2])}
  var M={seg:seg,work:0,done:0,nodata:0,items:{},byState:{},tpl:{"12":{work:0,nd:0,cards:0},"27":{work:0,nd:0,cards:0}}};
  seg.forEach(function(s){
    var d=s[1]-s[0];
    M.byState[s[2]]=(M.byState[s[2]]||0)+d;
    if(s[2]==1||s[2]==0){     // during "no data" the PLC card counter keeps counting and catches up after the link is back
      var t=M.tpl[tplAt(s[0])];t.cards+=d*rateAt(s[0]);M.done+=d*rateAt(s[0]);
      if(s[2]==1){M.work+=d;t.work+=d}else{M.nodata+=d;t.nd+=d}
      return;
    }
    var tag=s[2]==2?tags[s[0]]:null,ri=tag&&reasonInfo(tag);
    var key=s[2]==2?(tag?"t:"+tag:"s2"):"s"+s[2];
    var it=M.items[key]||(M.items[key]={key:key,st:s[2],label:tag||ST[s[2]].n,min:0,cards:0,
      group:tag?ri[1]:ST[s[2]].g,planned:s[2]==4||!!(ri&&ri[2])});
    it.min+=d;it.cards+=d*rateAt(s[0]);
  });
  M.done=Math.round(M.done);
  M.tpl["12"].n=Math.round(M.tpl["12"].cards);M.tpl["27"].n=M.done-M.tpl["12"].n;
  M.list=Object.keys(M.items).map(function(k){var it=M.items[k];
    it.lost=it.st==4?Math.max(0,it.min-SETUP_NORM):(it.planned?0:it.min);
    it.lostCards=it.cards*it.lost/it.min;return it});
  M.unplanned=M.list.reduce(function(a,i){return a+i.lost},0);
  M.setup=(M.items.s4||{min:0}).min;
  M.planNow=Math.round(PLAN*NOW/SH);
  M.gap=M.planNow-M.done;
  M.forecast=Math.round(M.done+(SH-NOW)*R27);
  M.perHour=M.done/(NOW/60);
  M.known=NOW-M.nodata;
  M.util=Math.round(M.work/M.known*100);
  M.changes=seg.filter(function(s){return s[2]==4}).map(function(s){return {a:s[0],b:s[1],d:s[1]-s[0],from:"№12",to:"№27"}});
  M.over=M.changes.reduce(function(a,c){return a+Math.max(0,c.d-SETUP_NORM)},0);
  M.cur=seg[seg.length-1];
  M.curDur=NOW-M.cur[0];
  M.untagged=seg.filter(function(s){return s[2]==2&&!tags[s[0]]});
  M.present=ORDER.filter(function(k){return M.byState[k]});
  M.hours=[];
  for(var h=0;h<12;h++){
    var a=h*60,b=Math.min(a+60,NOW),fact=0,cap=0;
    for(var m=a;m<b;m++){cap+=rateAt(m);seg.forEach(function(g){if((g[2]==1||g[2]==0)&&m>=g[0]&&m<g[1])fact+=rateAt(m)})}
    M.hours.push({h:h,fact:fact,cap:cap,partial:b-a<60,future:b<=a});
  }
  return M;
}

// ---- blocks ----
function lc(it){return it.st==2&&it.key!="s2"?it.label.toLowerCase():ST[it.st].lc}
// shown only when data is stale: a calm timestamp would hide a frozen screen
function stale(){return scen=="nolink"?'<section class="card alert mb" data-tour="stale"><span class="ic" style="--c:var(--pause)">'+ic("warn")+'</span><div><h2>Нет свежих данных 6 мин</h2><div class="s">Показано состояние на 19:34. Линия могла уже остановиться — проверьте на месте.</div></div></section>':""}
function statusPill(M){
  var c=M.cur;
  return '<span class="pill"><i class="dot" style="background:'+cv(ST[c[2]].c)+'"></i><b>'+(c[2]==1?"Работает":ST[c[2]].n)+'</b> '+dur(M.curDur)+'</span>';
}
function lossesLine(M){
  var top=M.list.filter(function(i){return i.lost>0}).sort(function(a,b){return b.lost-a.lost}),w="";
  if(top.length>1)w="Главные потери: <b>"+lc(top[0])+" "+top[0].lost+" мин</b>"+(top[0].key=="s2"?" (причина не указана)":"")+" и <b>"+lc(top[1])+" "+top[1].lost+" мин</b>. ";
  return w+"Переналадка — <b>"+M.setup+" мин</b> при норме "+SETUP_NORM+(M.over?" (+"+M.over+")":"")+".";
}
// director: the result of the shift in one line
function verdict(M){
  var head="К 19:40 сделано "+M.done+" карт при графике "+M.planNow+(M.gap>0?" (−"+M.gap+")":"")+". Прогноз к концу смены ≈ "+M.forecast+" из "+PLAN+".";
  return '<section class="card verdict mb" data-tour="verdict"><div class="vic neu">'+ic("target")+'</div><div>'+
    '<div class="head">'+head+'</div><div class="why">'+lossesLine(M)+' План'+TBD+'</div></div></section>';
}
// foreman: what needs action right now
function nowCard(M){
  var c=M.cur,items=[];
  items.push('<div class="it"><span class="ic" style="--c:'+cv(ST[c[2]].c)+'">'+ic(c[2]==1?"play":"stop")+'</span><div class="t"><b>'+(c[2]==1?"Линия работает":"Линия стоит: "+ST[c[2]].n.toLowerCase())+'</b> · '+dur(M.curDur)+'<small>шаблон №27 · сделано '+M.done+' карт, по графику '+M.planNow+'</small></div></div>');
  if(M.untagged.length){
    var min=M.untagged.reduce(function(a,s){return a+s[1]-s[0]},0);
    items.push('<div class="it"><span class="ic" style="--c:var(--pause)">'+ic("warn")+'</span><div class="t"><b>Нужно указать причину: '+M.untagged.length+' '+plural(M.untagged.length,"остановка","остановки","остановок")+' ('+min+' мин)</b><small>Без причины эти минуты не отнести ни к оборудованию, ни к материалу.</small></div><button class="btn" data-filter="Причина не указана" data-jump="1">Показать</button></div>');
  }
  if(M.over)items.push('<div class="it"><span class="ic" style="--c:var(--setup)">'+ic("swap")+'</span><div class="t"><b>Переналадка превысила норму на '+M.over+' мин</b><small>'+M.setup+' мин при норме '+SETUP_NORM+'</small></div></div>');
  return '<section class="card now-list mb" data-tour="now"><div class="ch"><h2>Сейчас на линии</h2></div>'+items.join("")+'</section>';
}
function kpi(icon,color,val,lbl,foot,extra){
  return '<div class="card kpi"><div class="row"><span class="ic" style="--c:'+cv(color)+'">'+ic(icon)+'</span><div><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div></div>'+(extra||'')+'<div class="foot">'+foot+'</div></div>';
}
function kpis(M){
  var ph=PLAN/12;
  return '<div class="grid kpis" data-tour="kpis">'+
   kpi("box","--ok",M.done+' <small>из '+PLAN+'</small>',"Выпущено карт",
     '<span class="delta '+(M.gap>0?'bad':'okc')+'">'+(M.gap>0?'↘ −'+M.gap:'↗ +'+(-M.gap))+'</span> к графику на 19:40 · план'+TBD,
     '<div class="track"><i style="width:'+M.done/PLAN*100+'%"></i><em style="left:'+M.planNow/PLAN*100+'%"></em></div>')+
   kpi("speed","--blue-d",M.perHour.toFixed(0)+' <small>карт/час</small>',"Темп",
     '<span class="delta '+(M.perHour<ph?'bad':'okc')+'">'+(M.perHour<ph?'↘ ':'↗ ')+(M.perHour-ph).toFixed(0)+'</span> к плану '+ph.toFixed(0)+' карт/час')+
   kpi("clock","--ok",M.util+'%',"Время в работе",
     dur(M.work)+' из '+dur(M.known)+(M.nodata?' · '+M.nodata+' мин без связи не считаем':''))+
   kpi("swap","--setup",M.setup+' <small>мин</small>',"Переналадки",
     '<span class="delta '+(M.over?'bad':'okc')+'">'+(M.over?'+'+M.over+' к норме':'в норме')+'</span> норма '+SETUP_NORM+' мин'+TBD)+
   '</div>';
}
function timeline(M,title,subtitle){
  var h='<section class="card mb" data-tour="timeline"><div class="ch"><h2>'+title+'</h2><div class="r hm"><span class="ghost">08:00–20:00</span></div><div class="sub">'+subtitle+'</div></div><div class="tlwrap"><div class="tl">';
  M.seg.forEach(function(s,i){h+='<div class="seg'+(selSeg===i?' sel':'')+'" data-i="'+i+'" style="left:'+pct(s[0])+'%;width:'+pct(s[1]-s[0])+'%;background:'+cv(ST[s[2]].c)+'"></div>'});
  h+='</div><div class="tpl">';
  TPLS.forEach(function(t){h+='<div class="seg" style="left:'+pct(t[0])+'%;width:'+pct(t[1]-t[0])+'%;background:'+cv(t[3])+'">'+(t[2]?tplLabel(t[2].slice(1)):"")+'</div>'});
  h+='</div><div class="axis">';
  for(var i=0;i<=12;i+=2)h+='<span class="'+(i%4?'odd':'')+'" style="left:'+pct(i*60)+'%">'+hm(i*60)+'</span>';
  h+='</div><div class="nowline" style="left:calc('+pct(NOW)+'% - 1px)"></div></div>'+
     '<div class="readout" id="readout">'+readoutHTML(M)+'</div><div class="legend">';
  M.present.forEach(function(k){h+='<span><i style="background:'+cv(ST[k].c)+'"></i>'+ST[k].n+'</span>'});
  return h+'<span><i style="background:var(--soft);outline:1px solid var(--line)"></i>Ещё не наступило</span></div></section>';
}
function readoutHTML(M){
  if(selSeg==null||!M.seg[selSeg])return "Нажмите на участок ленты — покажу время и причину.";
  var g=M.seg[selSeg],tag=g[2]==2?tags[g[0]]:null;
  return "<b>"+hm(g[0])+"–"+hm(g[1])+"</b> · "+ST[g[2]].n+(tag?" — "+tag:why[g[2]]?" — "+why[g[2]]:"")+" · "+dur(g[1]-g[0])+(g[2]==1?" · шаблон "+tplLabel(tplAt(g[0])):"");
}
function tplNameHTML(id){
  var nm=tplNames[id];
  if(role=="boss"&&editTpl===id)return '<div class="tname"><input class="tin" data-tid="'+id+'" value="'+(nm||"").replace(/"/g,"&quot;")+'" placeholder="Название шаблона" aria-label="Название шаблона №'+id+'"><button class="btn sm" data-tsave="'+id+'">Сохранить</button><button class="btn sm lt" data-tcancel="1">Отмена</button></div>';
  if(nm)return '<div class="tname"><span class="tn">'+nm+'</span>'+(role=="boss"?'<button class="btn sm lt" data-tedit="'+id+'">Изменить</button>':'')+'</div>';
  return '<div class="tname">'+(role=="boss"?'<button class="btn sm lt" data-tedit="'+id+'">Задать название</button>':'<span class="l">название задаёт начальник производства</span>')+'</div>';
}
function saveTpl(id){var i=document.querySelector('.tin[data-tid="'+id+'"]'),v=i?i.value.trim().slice(0,40):"";if(v)tplNames[id]=v;else delete tplNames[id];editTpl=null;render()}
function tplLabel(id){return "№"+id+(tplNames[id]?" · "+tplNames[id]:"")}
function templates(M){
  var rows=[["12","--tpl1"],["27","--tpl2"]].map(function(t){
    var o=M.tpl[t[0]],run=o.work+o.nd;
    return '<div class="tplc"><div class="tbadge" style="background:'+cv(t[1])+'">№'+t[0]+'</div><div>'+
      '<div class="n">'+o.n+' <small>карт</small></div>'+
      '<div class="l">в работе '+dur(o.work)+(o.nd?' + '+o.nd+' мин без связи':'')+' · '+Math.round(o.n/run*60)+' карт/час</div>'+
      tplNameHTML(t[0])+'</div></div>';
  }).join("");
  return '<section class="card mb" data-tour="templates"><div class="ch"><h2>Выпуск по шаблонам</h2><div class="sub">Какой шаблон работал и сколько карт на нём сделано. Карты за минуты без связи досчитаны по счётчику ПЛК.</div></div><div class="grid tp" style="margin:0">'+rows+'</div></section>';
}
function hourly(M){
  var W=640,H=260,L=36,R=8,Tp=12,B=30,pw=W-L-R,ph=H-Tp-B,YM=60,s="";
  var bw=pw/12,X=function(h){return L+h*bw},Y=function(v){return Tp+ph-v/YM*ph},planH=PLAN/12;
  [0,15,30,45,60].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  M.hours.forEach(function(o){
    var x=X(o.h)+bw*.2,w=bw*.6;
    if(!o.future){
      s+='<rect x="'+x+'" y="'+Y(o.cap)+'" width="'+w+'" height="'+(Y(0)-Y(o.cap))+'" rx="6" fill="var(--blue)" opacity=".45"/>';
      s+='<rect x="'+x+'" y="'+Y(o.fact)+'" width="'+w+'" height="'+(Y(0)-Y(o.fact))+'" rx="6" fill="var(--blue-d)"/>';
      if(o.partial)s+='<text x="'+(x+w/2)+'" y="'+(Y(o.cap)-6)+'" text-anchor="middle">идёт</text>';
    }
    s+='<text x="'+(X(o.h)+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+String(8+o.h).padStart(2,"0")+'</text>';
  });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(planH)+'" y2="'+Y(planH)+'" stroke="var(--tx)" stroke-dasharray="6 5" stroke-width="1.6"/>';
  s+='<text x="'+(W-R)+'" y="'+(Y(planH)-6)+'" text-anchor="end" style="fill:var(--tx);font-weight:600">план '+planH.toFixed(0)+'/час (демо)</text>';
  return '<section class="card" data-tour="hourly"><div class="ch"><h2>Выпуск по часам</h2><div class="r"><span class="legend" style="margin:0"><span><i style="background:var(--blue-d)"></i>Сделано</span><span><i style="background:var(--blue);opacity:.6"></i>Могли без простоев</span></span></div>'+
    '<div class="sub">Светлая часть столбика — сколько карт не сделали из-за остановок в этот час (оценка).</div></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Выпуск карт по часам">'+s+'</svg></section>';
}
function losses(M){
  var parts=M.present.filter(function(k){return k}).map(function(k){return [k,M.byState[k]]}),R=60,C=2*Math.PI*R,off=0,arcs="";
  parts.forEach(function(p){var len=p[1]/M.known*C;arcs+='<circle r="'+R+'" cx="75" cy="75" fill="none" stroke="'+cv(ST[p[0]].c)+'" stroke-width="20" stroke-dasharray="'+Math.max(len-2,0.5)+' '+(C-len+2)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 75 75)"/>';off+=len});
  var list=parts.filter(function(p){return p[0]!=1}).sort(function(a,b){return b[1]-a[1]}).slice(0,4).map(function(p){return '<li><i class="dot" style="background:'+cv(ST[p[0]].c)+'"></i>'+ST[p[0]].n+'<span>'+p[1]+' мин</span></li>'}).join("");
  var out='<div class="donut"><div class="c"><svg viewBox="0 0 150 150" width="150" height="150">'+arcs+'</svg><div><span><b>'+M.util+'%</b>в работе</span></div></div><ul>'+list+'</ul></div>'+(M.nodata?'<div class="sub" style="margin:0 0 4px">'+M.nodata+' мин без связи с ПЛК в расчёт не входят — это не простой.</div>':'');
  var groups={},mx=Math.max.apply(null,M.list.map(function(i){return i.min}));
  M.list.forEach(function(i){(groups[i.group]=groups[i.group]||[]).push(i)});
  GROUPS.forEach(function(g){
    if(!groups[g])return;
    out+='<div class="grp">'+(g=="Плановое"?"Плановое (против нормы)":g=="Предупреждения"?"Предупреждения — сработала тепловая защита":g)+'</div>';
    groups[g].sort(function(a,b){return b.min-a.min}).forEach(function(i){
      var isSetup=i.st==4,unk=i.key=="s2";
      out+='<div class="loss"><div class="nm">'+i.label+(unk?'<small><span class="unk">нужно указать причину</span></small>':'')+(isSetup?'<small>норма '+SETUP_NORM+' мин'+TBD+'</small>':'<small>'+srcHTML(i.st,i.key.indexOf("t:")==0)+'</small>')+'</div>'+
        '<div class="bar"><b style="width:'+i.min/mx*100+'%;background:'+cv(ST[i.st].c)+'"></b>'+(isSetup?'<em style="left:'+SETUP_NORM/mx*100+'%"></em>':'')+'</div>'+
        '<div class="num">'+i.min+' мин<small>'+(isSetup?'+'+i.lost+' сверх нормы':i.planned?'плановое':'≈ '+Math.round(i.lostCards)+' карт')+'</small></div></div>';
    });
  });
  return '<section class="card" data-tour="losses"><div class="ch"><h2>Куда ушло время</h2><div class="sub">Сколько минут смены заняло каждое состояние и что это стоило в картах.'+EST+'</div></div>'+out+'</section>';

function reasonBtns(start,small){

function events(M,editable){
  var rows=M.seg.filter(function(s){return s[2]!=1});

  var h='<section class="card mb" data-tour="events"><div class="ch"><h2>Остановки и события за смену</h2><div class="r"><span class="ghost">'+rows.length+' событий</span></div></div><div class="tabs">';
  tabs.forEach(function(t){var n=cnt(t[0]);if(!n&&t[0]!="all")return;h+='<button data-filter="'+t[0]+'" class="'+(evFilter==t[0]?'on':'')+'">'+t[1]+'<span>'+n+'</span></button>'});
  h+='</div><div class="tbl"><div class="tr th"><div>Время</div><div>Состояние</div><div>Причина</div><div class="d">Длит.</div><div class="c">Потеря (оценка)</div></div>';
  var shown=rows.filter(function(s){return evFilter=="all"||segGroup(s)==evFilter});
  if(!shown.length)h+='<div class="empty">В этой группе остановок нет.</div>';

      if(editable)cause+='<button class="btn'+(tag?' lt':'')+'" data-open="'+s[0]+'">'+(tag?'Изменить':'Указать причину')+'</button>';
    }else cause='<span>'+why[s[2]]+(s[2]==4?' · норма '+SETUP_NORM+' мин, '+(d>SETUP_NORM?'+'+(d-SETUP_NORM):'в норме'):'')+'</span>';
    cause+=srcHTML(s[2],tag);
    var ri=tag&&reasonInfo(tag),loss=s[2]==0?'не простой':(s[2]==4||(ri&&ri[2]))?'плановое':'≈ '+Math.round(d*rateAt(s[0]))+' карт';
    h+='<div class="tr row"><div class="tm">'+hm(s[0])+'–'+hm(s[1])+'</div><div><span class="badge" style="--c:'+cv(ST[s[2]].c)+(s[2]==0?';color:var(--mu)':'')+'"><i></i>'+ST[s[2]].n+'</span></div>'+
       '<div class="cause">'+cause+'</div><div class="d">'+d+' мин</div><div class="c">'+loss+'</div>';
    if(editable&&openTag===s[0])h+='<div class="chips">'+REASONS.map(function(r){return '<button class="chip" data-tag="'+r[0]+'" data-start="'+s[0]+'">'+r[0]+'</button>'}).join("")+'</div>';

function changeovers(M){
  var tot=M.changes.reduce(function(a,c){return a+c.d},0),mx=Math.max(SETUP_NORM*2,Math.max.apply(null,M.changes.map(function(c){return c.d})));

      '<div class="tpls"><i style="background:var(--tpl1)">'+c.from+'</i>→<i style="background:var(--tpl2)">'+c.to+'</i></div>'+
      '<div class="nbar"><b style="width:'+n/mx*100+'%"></b>'+(o?'<b class="over" style="left:'+n/mx*100+'%;width:'+o/mx*100+'%"></b>':'')+'<em style="left:'+SETUP_NORM/mx*100+'%"></em></div>'+

  }).join("");
  return '<section class="card mb" data-tour="changeovers"><div class="ch"><h2>Переналадки за смену</h2><div class="r"><span class="ghost">норма '+SETUP_NORM+' мин</span>'+TBD+'</div>'+
    '<div class="sub">Каждая смена шаблона: сколько длилась и насколько вышла за норму. Красное — превышение.</div></div>'+
    '<div class="chg"><div class="tot"><div class="v">'+tot+' <small>мин</small></div><div class="l">'+M.changes.length+' '+plural(M.changes.length,"смена шаблона","смены шаблона","смен шаблона")+'</div>'+
    '<div class="l '+(M.over?'bad':'okc')+'" style="font-weight:700">'+(M.over?'+'+M.over+' мин сверх нормы':'всё в норме')+'</div></div><div>'+rows+'</div></div></section>';
}

var tour=null;
function tourEl(key){   // several elements carry "side" (sidebar, rail, bottom bar): take the one that is on screen
  var a=document.querySelectorAll('[data-tour="'+key+'"]');
  for(var i=0;i<a.length;i++){var r=a[i].getBoundingClientRect();if(r.width>0&&r.right>0&&r.left<innerWidth)return a[i]}
  return null;
}
function startTour(){
  closeHelp();$("app").classList.remove("menu");
  if(ptab!="shift"){ptab="shift";render();scrollTopApp()}
  tour={steps:TOURS[role],i:0};
  if(!$("tour")){var d=document.createElement("div");d.id="tour";d.innerHTML='<div class="catch"></div><div class="spot"></div><div class="tip"></div>';document.body.appendChild(d)}
  showStep(0);
}
function showStep(i){
  if(!tour)return;
  if(i<0)i=0;
  if(i>=tour.steps.length){endTour();return}
  var st=tour.steps[i];
  if(st[3])st[3]();
  if(!tourEl(st[0])){showStep(i+(i>=tour.i?1:-1));return}   // block not on this screen — skip it
  tour.i=i;
  var el=tourEl(st[0]),tip=document.querySelector("#tour .tip");
  if(el.closest(".demo-bar"))window.scrollTo(0,0);else if(!el.closest(".side,.top,.rail,.tabbar"))el.scrollIntoView({block:"center"});else{window.scrollTo(0,0);var sc=document.querySelector(".scr");if(sc)sc.scrollTop=0}
  tip.innerHTML='<h3>'+st[1]+'</h3><p>'+st[2]+'</p><div class="bar2"><span class="cnt">'+(i+1)+' из '+tour.steps.length+'</span>'+
    (i?'<button class="btn lt" data-tstep="-1">Назад</button>':'<button class="btn lt" data-tend="1">Пропустить</button>')+
    '<button class="btn" data-tstep="1">'+(i==tour.steps.length-1?'Готово':'Далее')+'</button></div>';
  placeTour();
}
function placeTour(){
  if(!tour)return;
  var el=tourEl(tour.steps[tour.i][0]);if(!el)return;
  var r=el.getBoundingClientRect(),p=8,spot=document.querySelector("#tour .spot"),tip=document.querySelector("#tour .tip");
  var top=Math.max(r.top-p,4),bottom=Math.min(r.bottom+p,innerHeight-4);
  spot.style.left=(r.left-p)+"px";spot.style.top=top+"px";spot.style.width=(r.width+2*p)+"px";spot.style.height=(bottom-top)+"px";
  var tw=tip.offsetWidth,th=tip.offsetHeight,tl=Math.min(Math.max(12,r.left),innerWidth-tw-12),tt;
  if(bottom+12+th<innerHeight)tt=bottom+12;else if(top-12-th>0)tt=top-12-th;else tt=innerHeight-th-12;
  tip.style.left=tl+"px";tip.style.top=tt+"px";
}
function endTour(){tour=null;var t=$("tour");if(t)t.remove();if(role=="op")render()}
function openHelp(){var h=$("help");h.innerHTML=helpHTML();h.classList.add("open")}
function closeHelp(){$("help").classList.remove("open")}

// ---- render & events ----
var M_;
function render(){
  M_=model();
  frame();
  compact=$("app").clientWidth<600;
  var keep=document.querySelector(".scr"),top=keep?keep.scrollTop:0;
  $("app").innerHTML='<div class="scr">'+(role=="op"?viewOperator(M_):role=="foreman"?viewForeman(M_):viewBoss(M_))+'</div><div class="mbk" data-menu="close"></div>'+promptHTML();
  if(screen!="desk")document.querySelector(".scr").scrollTop=top;
  $("screens").innerHTML=SCREENS.filter(function(r){return !(role=="op"&&r[0]=="phone")}).map(function(r){return '<button data-screen="'+r[0]+'" class="'+(r[0]==screen?"on":"")+'">'+r[1]+'</button>'}).join("")+
    (screen=="tab"?'<button data-rotate="1" title="Повернуть планшет">↻ '+(tabRot=="land"?"Вертикально":"Горизонтально")+'</button>':'');
  $("roles").innerHTML=ROLES.map(function(r){return '<button data-role="'+r[0]+'" class="'+(r[0]==role?"on":"")+'"><span class="lgl">'+r[1]+'</span><span class="shl">'+r[3]+'</span></button>'}).join("");
  $("scens").innerHTML=SCENS.map(function(r){return '<button data-scen="'+r[0]+'" class="'+(r[0]==scen?"on":"")+'">'+r[1]+'</button>'}).join("");
}
// a stop without a reason takes over the operator's screen right away (product rule); "later" folds it into the card
function promptHTML(){
  var c=M_.cur;
  if(role!="op"||tour||c[2]!=2||tags[c[0]]||promptLater===c[0])return "";
  return '<div class="prompt" role="dialog" aria-modal="true" aria-labelledby="pq"><div class="pbox"><div class="pt"><span class="ic">'+ic("stop")+'</span><div>'+
    '<div class="ctx">Линия Цесис 2 · стоит '+dur(M_.curDur)+', с '+hm(c[0])+'</div><h2 id="pq">Почему остановилась Цесис 2?</h2></div></div>'+
    reasonBtns(c[0])+'<div class="later"><button class="btn lt" data-later="'+c[0]+'">Укажу позже</button></div></div></div>';
}
function scrollTopApp(){window.scrollTo(0,0);var sc=document.querySelector(".scr");if(sc)sc.scrollTop=0}
document.addEventListener("click",function(e){
  var seg=e.target.closest(".tl .seg");
  if(seg&&!tour){selSeg=+seg.dataset.i===selSeg?null:+seg.dataset.i;render();return}
  var b=e.target.closest("button,[data-help],[data-menu]");if(!b)return;
  var d=b.dataset;
  if(d.menu){$("app").classList.toggle("menu",d.menu=="open");return}
  if(d.later){promptLater=+d.later;render();return}
  if(d.tedit){editTpl=d.tedit;render();var t=document.querySelector(".tin");if(t)t.focus();return}
  if(d.tsave){saveTpl(d.tsave);return}
  if(d.tcancel){editTpl=null;render();return}
  if(d.pick){$("app").classList.remove("menu");if(ptab!="shift"){ptab="shift";render();scrollTopApp()}return}
  if(d.ptab){ptab=d.ptab;render();scrollTopApp();return}
  if(d.goto){$("app").classList.remove("menu");
    if(compact){ptab="events";render();scrollTopApp();return}
    var ev=document.querySelector('[data-tour="events"]')||document.querySelector('[data-tour="unt"]');if(ev)ev.scrollIntoView({behavior:"smooth",block:"start"});else toast("Журнал событий в прототипе есть у начальника участка и начальника производства");return}
  if(d.stub){toast("В прототипе открывается только «Линия Цесис 2»");return}
  if(d.unit){closedUnits[d.unit]=!closedUnits[d.unit];render();return}
  if(d.tstep){showStep(tour.i+(+d.tstep));return}
  if(d.tend){endTour();return}
  if(d.tourstart){startTour();return}
  if(d.help){$("help").classList.contains("open")?closeHelp():openHelp();return}
  if(d.rotate){tabRot=tabRot=="land"?"port":"land";try{localStorage.setItem("cesis2-rot",tabRot)}catch(x){}var a2=$("app");a2.classList.add("noanim");render();setTimeout(function(){a2.classList.remove("noanim")},60);return}
  if(d.screen){screen=d.screen;try{localStorage.setItem("cesis2-screen",screen)}catch(x){}var ap=$("app");ap.classList.remove("menu");ap.classList.add("noanim");render();setTimeout(function(){ap.classList.remove("noanim")},60);window.scrollTo(0,0);return}
  if(d.role){role=d.role;if(role=="op"&&screen=="phone"){screen="tab";tabRot="land"}$("app").classList.remove("menu");try{history.replaceState(null,"","#"+role)}catch(x){}openTag=null;selSeg=null}
  else if(d.scen){scen=d.scen;openTag=null;selSeg=null;promptLater=null}
  else if(d.tag){tags[+d.start]=d.tag;openTag=null}
  else if(d.untag){delete tags[+d.untag]}
  else if(d.open){openTag=openTag===+d.open?null:+d.open}
  else if(d.filter){evFilter=d.filter}
  else return;
  render();
  if(d.jump){var t=document.querySelector(".tabs");if(t)t.scrollIntoView({behavior:"smooth",block:"center"})}
});

function frame(){
  var dev=screen!="desk"&&innerWidth>=700,b=document.body;
  b.style.setProperty("--barh",document.querySelector(".demo-bar").offsetHeight+"px");
  b.classList.toggle("dev",dev);b.classList.toggle("phone",dev&&screen=="phone");b.classList.toggle("tab",dev&&screen=="tab");
  b.classList.toggle("land",tabRot=="land");b.classList.toggle("port",tabRot=="port");
  var box=$("devbox"),d=$("dev");
  if(!dev){box.style.width=box.style.height="";d.style.transform="";$("sbar").innerHTML="";return}
  $("sbar").innerHTML=screen=="phone"?'<span>19:40</span><span class="ics">'+SIG+WIFI+BATT+'</span>'
                                     :'<span>19:40&nbsp;&nbsp;Ср 28 окт.</span><span class="ics">'+WIFI+'<span>87%</span>'+BATT+'</span>';
  var W=d.offsetWidth,H=d.offsetHeight,bar=document.querySelector(".demo-bar").offsetHeight;
  var k=Math.min(1,(innerWidth-40)/W,(innerHeight-bar-52)/H);
  d.style.transform="scale("+k+")";box.style.width=W*k+"px";box.style.height=H*k+"px";
}
addEventListener("resize",function(){frame();if(($("app").clientWidth<600)!=compact)render();placeTour()});
document.addEventListener("keydown",function(e){
  if(e.key=="Enter"&&e.target.classList.contains("tin")){e.preventDefault();saveTpl(e.target.dataset.tid);return}
  if(tour){if(e.key=="Escape")endTour();else if(e.key=="ArrowRight")showStep(tour.i+1);else if(e.key=="ArrowLeft")showStep(tour.i-1)}
  else if(e.key=="Escape")closeHelp();
});
addEventListener("scroll",placeTour,{passive:true,capture:true});
var toastT;
function toast(t){var el=$("toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el)}el.textContent=t;el.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){el.style.display="none"},2200)}
render();
// first visit: start the tour once
var seen=false;try{seen=localStorage.getItem("cesis2-tour")=="1";localStorage.setItem("cesis2-tour","1")}catch(x){}
if(!seen)setTimeout(startTour,500);
